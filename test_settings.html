<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>测试设置页面</title>
    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            color: white;
        }
        
        .tab-navigation {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            background: rgba(26, 26, 46, 0.9);
            backdrop-filter: blur(10px);
            z-index: 50;
            border-bottom: 1px solid #333;
        }
        
        .tab-btn {
            padding: 12px 24px;
            background: none;
            border: none;
            color: #999;
            cursor: pointer;
            transition: all 0.2s ease;
            border-bottom: 2px solid transparent;
        }
        
        .tab-btn:hover {
            color: white;
            background: rgba(255, 255, 255, 0.05);
        }
        
        .tab-btn.active {
            color: white;
            border-bottom-color: #3b82f6;
        }
        
        .tab-content {
            padding-top: 60px;
            height: 100vh;
        }
        
        .tab-pane {
            display: none;
            padding: 20px;
        }
        
        .tab-pane.active {
            display: block;
        }
        
        .settings-container {
            max-width: 800px;
            margin: 0 auto;
            background: rgba(30, 30, 50, 0.8);
            border-radius: 16px;
            padding: 24px;
            border: 1px solid #333;
        }
        
        .setting-group {
            margin-bottom: 24px;
        }
        
        .setting-group h3 {
            margin-bottom: 16px;
            color: #3b82f6;
        }
        
        .setting-item {
            margin-bottom: 12px;
        }
        
        .setting-item label {
            display: block;
            margin-bottom: 4px;
            color: #ccc;
        }
        
        .setting-item input,
        .setting-item select {
            width: 100%;
            padding: 8px 12px;
            background: #2d2d4a;
            border: 1px solid #444;
            border-radius: 8px;
            color: white;
        }
    </style>
</head>
<body>
    <!-- 标签页导航 -->
    <div class="tab-navigation">
        <button class="tab-btn active" onclick="switchTab('test')">测试</button>
        <button class="tab-btn" onclick="switchTab('settings')">设置</button>
    </div>
    
    <!-- 标签页内容 -->
    <div class="tab-content">
        <!-- 测试页面 -->
        <div id="page-test" class="tab-pane active">
            <h2>测试页面</h2>
            <p>这是测试页面内容</p>
        </div>
        
        <!-- 设置页面 -->
        <div id="page-settings" class="tab-pane">
            <div class="settings-container">
                <h2>系统设置</h2>
                
                <div class="setting-group">
                    <h3>通讯设置</h3>
                    <div class="setting-item">
                        <label>Modbus 地址</label>
                        <input type="number" value="1" id="modbus-address">
                    </div>
                    <div class="setting-item">
                        <label>端口</label>
                        <input type="number" value="502" id="modbus-port">
                    </div>
                    <div class="setting-item">
                        <label>主机</label>
                        <input type="text" value="localhost" id="modbus-host">
                    </div>
                </div>
                
                <div class="setting-group">
                    <h3>产品设置</h3>
                    <div class="setting-item">
                        <label>产品型号</label>
                        <input type="text" value="MODEL001" id="product-model">
                    </div>
                    <div class="setting-item">
                        <label>ATEQ程序号1</label>
                        <input type="number" value="1" id="ateq-program-1">
                    </div>
                </div>
                
                <button onclick="saveSettings()">保存设置</button>
            </div>
        </div>
    </div>
    
    <script>
        function switchTab(tabName) {
            // 隐藏所有标签页
            document.querySelectorAll('.tab-pane').forEach(pane => {
                pane.classList.remove('active');
            });
            
            // 移除所有标签按钮的活动状态
            document.querySelectorAll('.tab-btn').forEach(btn => {
                btn.classList.remove('active');
            });
            
            // 显示选中的标签页
            document.getElementById(`page-${tabName}`).classList.add('active');
            
            // 激活选中的标签按钮
            event.target.classList.add('active');
        }
        
        function saveSettings() {
            alert('设置已保存！');
        }
    </script>
</body>
</html>
